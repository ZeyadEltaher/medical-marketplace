name: Build Medical App Image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and push Medical App
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Medical App image
        run: |
          docker build \
            --pull \
            --file Dockerfile \
            --tag medical-app:latest \
            --tag ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/medical-app:latest \
            .

      - name: Push Medical App image
        run: docker push ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/medical-app:latest
