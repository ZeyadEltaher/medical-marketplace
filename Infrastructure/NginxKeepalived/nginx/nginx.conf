events {
    worker_connections 1024;
}

http {

    upstream medical_backend {
        least_conn;

        server 172.30.0.13:7110;
        server 172.30.0.14:7110;
        server 172.30.0.15:7110;

        keepalive 32;
    }

    server {

        listen 443 ssl;

        server_name localhost;

        ssl_certificate /etc/nginx/certs/medical.crt;
        ssl_certificate_key /etc/nginx/certs/medical.key;

        location / {

            proxy_pass https://medical_backend;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;

            proxy_set_header Connection "";

            proxy_ssl_verify off;
        }
    }

    server {

        listen 127.0.0.1:8080;

        location = /health {
            access_log off;
            return 200 "OK\n";
        }
    }
}