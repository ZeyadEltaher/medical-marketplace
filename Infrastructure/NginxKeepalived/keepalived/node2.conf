global_defs {
    router_id MEDICAL_NODE_2
    script_user root
    enable_script_security
}

vrrp_script check_nginx {
    script "/usr/bin/wget -q -O /dev/null http://127.0.0.1:8080/health"
    interval 2
    timeout 1
    fall 2
    rise 2
}

vrrp_instance VI_MEDICAL {
    state BACKUP

    interface eth0

    virtual_router_id 51
    priority 100
    advert_int 1

    unicast_src_ip 172.30.0.12

    unicast_peer {
        172.30.0.11
    }

    virtual_ipaddress {
        172.30.0.100/24 dev eth0
    }

    track_script {
        check_nginx
    }
}
