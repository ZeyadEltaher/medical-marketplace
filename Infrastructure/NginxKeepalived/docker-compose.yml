
services:

  nginx1:
    image: nginx:stable
    container_name: medical-nginx-1
    restart: unless-stopped

    volumes:
      - ./certs:/etc/nginx/certs:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    networks:
      medical-ha:
        ipv4_address: 172.30.0.11

  keepalived1:
    image: osixia/keepalived:2.4.3
    container_name: medical-keepalived-1
    restart: unless-stopped

    network_mode: "service:nginx1"

    cap_add:
      - NET_ADMIN
      - NET_RAW
      - NET_BROADCAST

    volumes:
      - ./keepalived/node1.conf:/etc/keepalived/keepalived.conf:ro

    depends_on:
      - nginx1

  nginx2:
    image: nginx:stable
    container_name: medical-nginx-2
    restart: unless-stopped

    volumes:
      - ./certs:/etc/nginx/certs:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    networks:
      medical-ha:
        ipv4_address: 172.30.0.12

  keepalived2:
    image: osixia/keepalived:2.4.3
    container_name: medical-keepalived-2
    restart: unless-stopped

    network_mode: "service:nginx2"

    cap_add:
      - NET_ADMIN
      - NET_RAW
      - NET_BROADCAST

    volumes:
      - ./keepalived/node2.conf:/etc/keepalived/keepalived.conf:ro

    depends_on:
      - nginx2

networks:
  medical-ha:
    external: true
    name: medical-ha
